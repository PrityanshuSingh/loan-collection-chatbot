version: '3.9'

services:
  loan_app:
    image: loan-collection-chatbot:latest   # use the image you already built
    ports:
      - "8501:8501"
    volumes:
      - .:/app    # mount your local code inside the container
    environment:
      PYTHONPATH: /app/src:/app
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
